---
strategy: polling
no_screen_padding: 'no'
dark_mode: 'no'
static_data: ''
polling_verb: get
framework_version: 3.4.0
serverless_language: ''
refresh_interval_floor: ''
polling_url: https://meteo.dob-world.com/forecast.json
polling_headers: ''
polling_body: ''
oauth_enabled: 'false'
oauth_pkce_enabled: 'no'
oauth_authorize_url: ''
oauth_token_url: ''
oauth_scopes: ''
oauth_scope_separator: ''
oauth_refresh_url: ''
oauth_auth_params: ''
oauth_token_headers: ''
oauth_token_site: ''
oauth_token_params: ''
oauth_token_request_auth_method: ''
oauth_body_format: ''
oauth_token_response_metadata: ''
oauth_authorization_method: ''
oauth_refresh_params: ''
oauth_token_field_name: ''
oauth_expiry_field_name: ''
oauth_expiry_strategy: ''
oauth_fixed_expiry_ms: ''
custom_fields:
- keyname: language
  field_type: select
  name: Idioma
  description: Idioma de los textos de la pantalla.
  options:
  - Català: ca
  - Castellano: es
  - English: en
  default: ca
- keyname: about
  field_type: author_bio
  name: About This Plugin
  category: environment,life
  description: Weather forecast for Cerdanyola del Vallès (Barcelona) from meteo.dob-world.com, a home weather station. Combines AEMET with the AROME, ECMWF and ICON models. Shows the current hour, a 24 h temperature chart with hourly rain bars, rain windows and the next 5 days. Languages - Catalan, Spanish and English. Unofficial personal project.
  github_url: https://github.com/mikim83/cerdanyola-trmnl-forecast
  description-es: Previsión del tiempo para Cerdanyola del Vallès (Barcelona) de meteo.dob-world.com, una estación meteorológica doméstica. Combina AEMET con los modelos AROME, ECMWF e ICON. Muestra la hora actual, un gráfico de temperatura a 24 h con barras de lluvia por hora, los tramos de lluvia y los próximos 5 días. Idiomas - catalán, castellano e inglés. Proyecto personal no oficial.
  description-ca: Previsió del temps per a Cerdanyola del Vallès (Barcelona) de meteo.dob-world.com, una estació meteorològica domèstica. Combina l'AEMET amb els models AROME, ECMWF i ICON. Mostra l'hora actual, un gràfic de temperatura a 24 h amb barres de pluja per hora, els trams de pluja i els propers 5 dies. Idiomes - català, castellà i anglès. Projecte personal no oficial.
  learn_more_url: https://meteo.dob-world.com
name: Cerdanyola Forecast
description: Previsió del temps a Cerdanyola del Vallès (meteo.dob-world.com)
refresh_interval: 60
